{% extends 'base.html' %}


{% block content %}
      <!-- Экран входа -->
  <div id="login"
    class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-950">
    <div
      class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-8 space-y-6 border border-gray-200 dark:border-gray-700">
      <div class="text-center">
        <h1 class="text-2xl font-bold">Вход в ИРБИС</h1>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">Авторизуйтесь для работы с каталогом</p>
      </div>
      <form id="loginForm" class="space-y-5">
        <input type="text" required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-primary-600 outline-none"
          placeholder="Логин / Номер читательского">
        <input type="password" required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-primary-600 outline-none"
          placeholder="Пароль">
        <button type="submit"
          class="w-full py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg transition">Войти</button>
      </form>
    </div>
  </div>
{% endblock content %}
