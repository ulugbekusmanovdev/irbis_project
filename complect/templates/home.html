{% extends 'base.html' %}
{% block content %}



<!-- Первый блок: список КСУ -->
          <div id="blockDefault" class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
            <div class="px-6 py-3 border-b font-medium text-lg flex justify-between items-center">
              <span>Задание номера КСУ поступления</span>
            </div>

            <div class="p-4 flex gap-4">
              <div class="w-full border-r border-gray-300 dark:border-gray-600 pr-4">
                <button id="newKsuBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded mb-3">
                  + Новая КСУ
                </button>
                <div class="font-medium mb-2">Номер КСУ (номер акта):</div>
                <ul class="space-y-1">
                  <li class="flex items-center gap-2 bg-blue-100 dark:bg-blue-900/30 p-1 rounded">
                    <input type="checkbox" checked class="w-4 h-4">
                    <span class="flex-1">1 2024</span>
                    <button class="px-2 py-1 text-sm bg-gray-200 rounded hover:bg-gray-300 edit-btn">Изменить</button>
                  </li>
                  <li class="flex items-center gap-2 p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">
                    <input type="checkbox" class="w-4 h-4">
                    <span class="flex-1">1 2024/01</span>
                    <button class="px-2 py-1 text-sm bg-gray-200 rounded hover:bg-gray-300 edit-btn">Изменить</button>
                  </li>
                </ul>
              </div>

              
            </div>
          </div>

{% endblock content %}
