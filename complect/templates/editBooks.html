{% extends 'base.html' %}
{% load tailwind_filters %}
{% block content %}


        <form action="" method="POST">
        <div id="ksuPage" class="flex flex-col gap-4">
    
          <!-- Второй блок: форма ввода/редактирования КСУ -->
          <div id="blockKsu" class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 flex flex-col gap-4">
            <div id="mainTable">

                <div class="px-6 py-3 border-b font-medium text-lg flex justify-between items-center">
              <span>Ввод/Редактирование КСУ</span>
            </div>

            <div class="p-4 flex flex-col gap-3">
              <thead>
                  <tr class="bg-gray-200 dark:bg-gray-700">
                    <th class="px-4 py-2">✓ Название элемента</th>
                    
                    <th class="px-4 py-2">Значение</th>
                  </tr>
                </thead>
              <table class="w-full border-collapse text-left text-sm">
               

                  {% csrf_token %}
                  {{ form|crispy }}


             
                
              </table>
            </div>

            </div>
            
            <div id="distributionTable" class="hidden">
              <div class="font-medium mb-4">Данные распределения партии</div>
              <table class="w-full border-collapse text-left text-sm">
                <thead>
                  <tr class="bg-gray-200 dark:bg-gray-700">
                    <th class="px-4 py-2">✓ Название элемента</th>

                    <th class="px-4 py-2">Значение</th>
                  </tr>
                </thead>
                

                

                  {% csrf_token %}
                  {{ rasp_form|crispy }}
<!-- 
<button type="submit">Изменить</button> -->
                  
                
                
              </table>
            </div>
            <div class="px-6 py-3 border-t bg-gray-50 dark:bg-gray-900 flex justify-between flex-wrap gap-2">
              <div class="flex gap-3 flex-wrap">
                <button type="button" id="btnMain"
                  class="tab-btn px-4 py-2 bg-indigo-600 text-white font-medium rounded hover:bg-indigo-700">Ввод записи
                  в КСУ поступлений</button>
                <button type="button" id="btnDistribution" class="tab-btn px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Данные
                  распределения</button>
              </div>
              <div class="flex gap-3">
                <button type="submit" value="Submit" class="px-6 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                  </svg>
                  Ввод
                </button>
                <button id="ksuCancel"
                  class="px-6 py-2 border border-red-300 text-red-600 rounded hover:bg-red-50">Отказ</button>
              </div>
            </div>
          </div>
        </div>
        </form>

{% endblock content %}
